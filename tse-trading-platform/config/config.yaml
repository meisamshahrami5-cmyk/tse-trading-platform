project:
  name: "TSE Trading Platform"
  version: "1.1.0"

data:
  symbols:
    - "btc-usd"
    - "eth-usd"
    - "bnb-usd"
    - "sol-usd"
    - "ada-usd"
  days_back: 1000
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"

indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  moving_averages: [7, 20, 50, 200]

ml:
  test_size: 0.2
  random_state: 42
  prediction_horizon: 5

api:
  host: "0.0.0.0"
  port: 8000
  secret_key: "your-secret-key-change-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30
